[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-flow-stock-navigator"
version = "1.0.0"
description = "Cross-asset macroeconomic alignment engine and options playbook generator"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tabulate>=0.9.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0"
]
